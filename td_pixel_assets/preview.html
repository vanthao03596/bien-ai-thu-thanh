<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TD Pixel Pack — xem trước animation</title>
<style>
:root{--bg:#15131b;--panel:#1f1c27;--panel2:#262232;--ink:#efe8d8;--mute:#a49db3;--gold:#e3b02a;--line:#322d40}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
header{padding:22px 24px 10px;max-width:1400px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px;letter-spacing:.2px}
h1 span{color:var(--gold)}
header p{margin:0;color:var(--mute);max-width:860px}
nav{position:sticky;top:0;z-index:5;background:rgba(21,19,27,.96);border-bottom:1px solid var(--line)}
nav .in{max-width:1400px;margin:0 auto;padding:8px 24px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
nav button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
nav button.on{background:var(--gold);color:#1d1322;border-color:var(--gold);font-weight:600}
nav .opts{margin-left:auto;display:flex;gap:10px;align-items:center;color:var(--mute);font-size:13px}
nav select,nav label{font:inherit;color:var(--ink)}
nav select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
main{max-width:1400px;margin:0 auto;padding:16px 24px 60px}
section{display:none}section.on{display:block}
h2{font-size:16px;margin:18px 0 10px;color:var(--gold)}
.note{color:var(--mute);font-size:13px;margin:-4px 0 12px;max-width:900px}
.grid{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.card h3{margin:0 0 2px;font-size:14px}
.card .meta{color:var(--mute);font-size:12px;margin-bottom:8px}
.anims{display:flex;flex-wrap:wrap;gap:10px}
.anim{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mute)}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;border-radius:4px}
.sprites{display:flex;flex-wrap:wrap;gap:8px}
.sp{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--mute);max-width:120px;text-align:center;word-break:break-all}
#demoWrap{background:#0e0d12;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto}
#demo{margin:0 auto}
.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--mute);font-size:13px;margin-top:8px}
.legend b{color:var(--ink)}
</style>
</head>

</header>

const IMG = {};
const S = {};
for (const e of DATA.manifest) S[e.name] = e;
const BGS = {grass:'#4f8f33', dark:'#2a2633', checker:null, sky:'#6aa8c8'};
let bgMode = 'grass', flipSide = false;

function loadAll(){
  const pngs = new Set(DATA.manifest.map(e=>e.png));
  for (const t of Object.values(DATA.tiles)) pngs.add(t.png);
  return Promise.all([...pngs].map(p=>new Promise(res=>{const i=new Image();i.onload=()=>{IMG[p]=i;res()};i.onerror=()=>{console.warn('miss',p);res()};i.src=p;})));
}
function anim(e,name){return e.anims.find(a=>a.name===name)}
function frameIdx(a,t){let f=Math.floor(t*a.fps);return a.loop?f%a.frames:Math.min(f,a.frames-1)}
function draw(ctx,name,an,t,x,y,flip=false,alpha=1,fixedFrame=null){
  const e=S[name];const a=anim(e,an);if(!a)return;
  const f=fixedFrame!==null?fixedFrame:frameIdx(a,t);
  const img=IMG[e.png];if(!img)return;
  ctx.save();ctx.globalAlpha=alpha;
  x=Math.round(x);y=Math.round(y);
  if(flip){ctx.translate(x,0);ctx.scale(-1,1);ctx.drawImage(img,f*e.fw,a.row*e.fh,e.fw,e.fh,-e.anchor[0],y-e.anchor[1],e.fw,e.fh);}
  else ctx.drawImage(img,f*e.fw,a.row*e.fh,e.fw,e.fh,x-e.anchor[0],y-e.anchor[1],e.fw,e.fh);
  ctx.restore();
}
function drawAtlas(ctx,atlas,frame,x,y,px=.5,py=.92){
  const e=S[atlas];const fr=e.atlas[frame];if(!fr)return;
  ctx.drawImage(IMG[e.png],fr.x,fr.y,fr.w,fr.h,Math.round(x-fr.w*px),Math.round(y-fr.h*py),fr.w,fr.h);
}
function fillBg(ctx,w,h){
  if(BGS[bgMode]){ctx.fillStyle=BGS[bgMode];ctx.fillRect(0,0,w,h);return}
  for(let y=0;y<h;y+=8)for(let x=0;x<w;x+=8){ctx.fillStyle=((x+y)/8)%2?'#3a3646':'#302c3b';ctx.fillRect(x,y,8,8)}
}

const TABS=[['demo','Màn demo'],['enemies','Quái'],['heroes','Hero & lính'],['towers','Tháp'],['fx','Đạn & hiệu ứng'],['tiles','Tile & trang trí'],['ui','UI']];
const tabsEl=document.getElementById('tabs'),main=document.getElementById('main');
const sections={};
for(const [id,label] of TABS){
  const b=document.createElement('button');b.textContent=label;b.dataset.id=id;tabsEl.appendChild(b);
  const s=document.createElement('section');s.id='s-'+id;main.appendChild(s);sections[id]=s;
  b.onclick=()=>show(id);
}
const opts=document.createElement('div');opts.className='opts';
opts.innerHTML='<label>Nền <select id="bgSel"><option value="grass">Cỏ</option><option value="dark">Tối</option><option value="checker">Ô kẻ</option><option value="sky">Trời</option></select></label><label><input type="checkbox" id="flipChk"> Lật trái (side)</label>';
tabsEl.appendChild(opts);
document.getElementById('bgSel').onchange=e=>bgMode=e.target.value;
document.getElementById('flipChk').onchange=e=>flipSide=e.target.checked;
function show(id){
  for(const b of tabsEl.querySelectorAll('button'))b.classList.toggle('on',b.dataset.id===id);
  for(const k in sections)sections[k].classList.toggle('on',k===id);
  try{history.replaceState(null,'','#'+id)}catch(e){}
  if(id==='demo'&&window.fitDemo)fitDemo();
}

const players=[];
function scaleFor(e){const m=Math.max(e.fw,e.fh);return m<=20?4:m<=32?3:2}
function sheetCard(e,parent,extra){
  const c=document.createElement('div');c.className='card';
  const sc=scaleFor(e);
  c.innerHTML=`<h3>${e.name}</h3><div class="meta">${e.png} · khung ${e.fw}×${e.fh} · anchor (${e.anchor[0]}, ${e.anchor[1]})${extra||''}</div>`;
  const wrap=document.createElement('div');wrap.className='anims';c.appendChild(wrap);
  for(const a of e.anims){
    const d=document.createElement('div');d.className='anim';
    const cv=document.createElement('canvas');cv.width=e.fw*sc;cv.height=e.fh*sc;
    d.appendChild(cv);const l=document.createElement('div');l.textContent=`${a.name} · ${a.frames}f · ${a.fps}fps${a.loop?'':' · 1 lần'}`;d.appendChild(l);
    wrap.appendChild(d);
    players.push({cv,ctx:cv.getContext('2d'),e,a,sc,t0:Math.random()*2,el:c});
  }
  parent.appendChild(c);return c;
}
function heading(sec,txt,note){const h=document.createElement('h2');h.textContent=txt;sec.appendChild(h);if(note){const p=document.createElement('div');p.className='note';p.textContent=note;sec.appendChild(p)}const g=document.createElement('div');g.className='grid';sec.appendChild(g);return g}

  const sec=sections.demo;
  sec.innerHTML='<h2>Màn demo ghép từ chính các asset trong bộ</h2><div class="note">Bản đồ 20×12 ô ghép từ autotile, quái lấy hướng đi để chọn walk_side / walk_down / walk_up, cung thủ đổi hướng bắn theo mục tiêu, đạn pháo bay vòng cung, lính và hero đánh khi quái tới gần, quái chết rơi vàng.</div><div id="demoWrap"><canvas id="demo" width="'+W+'" height="'+H+'"></canvas></div><div class="legend"><span><b>Tháp cung</b> L3 + L1 · 2 cung thủ/tháp</span><span><b>Tháp phép</b> L3</span><span><b>Tháp pháo</b> L2</span><span><b>Doanh trại</b> L2 + 3 lính ở cờ tập kết</span><span><b>Hero</b> Paladin</span><span><b>Ô xây</b> trống ở trên</span></div>';
  const cv=document.getElementById('demo');const ctx=cv.getContext('2d');
  function fit(){const w=document.getElementById('demoWrap').clientWidth-20;const k=w>0?Math.max(1,Math.floor(w/W*2)/2):2;cv.style.width=(W*k)+'px';cv.style.height=(H*k)+'px'}
  window.fitDemo=fit;fit();addEventListener('resize',fit);
  buildMap();setupUnits();
  for(let i=0;i<240;i++)update(1/30);
  demoCtx=ctx;
}
let demoCtx=null;
function loop(ts){const t=ts/1000;const dt=Math.min(.05,last?t-last:0);last=t;
  if(demoCtx&&sections.demo.classList.contains('on')){update(dt);render(demoCtx)}
  tickGallery(t);if(Math.floor(t*2)!==Math.floor((t-dt)*2))paintStatics();requestAnimationFrame(loop)}
loadAll().then(()=>{startDemo();buildGallery();paintStatics();const h=(location.hash||'').slice(1);show(TABS.some(t=>t[0]===h)?h:'demo');requestAnimationFrame(loop)});
</script>
