<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Biên Ải - game thủ thành pixel chơi ngay trên trình duyệt: xây tháp, điều tướng, dùng phép và giữ cổng thành qua ba màn chơi." />
    <meta name="theme-color" content="#1d1322" />
    <meta property="og:title" content="Biên Ải - Thủ Thành Pixel" />
    <meta property="og:description" content="Game thủ thành pixel chơi ngay trên trình duyệt: xây tháp, điều tướng, dùng phép và giữ cổng thành." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Biên Ải - Thủ Thành Pixel</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1d1322; overflow: hidden; }
      body { touch-action: none; }
      #app { position: fixed; inset: 0; }
      /* the backing store is a whole multiple of 768x432; let the browser smooth the final fit */
      #app canvas { display: block; image-rendering: auto !important; outline: none; }
      /* a phone held upright: the wide battlefield would shrink to a strip, so ask for a turn instead */
      #rotate {
        position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; align-items: center; justify-content: center;
        gap: 20px; padding: 24px; background: #1d1322; color: #f6efd8; font: 28px/1.2 VT323, monospace; text-align: center;
      }
      #rotate p { margin: 0; }
      #rotate .phone { width: 44px; height: 76px; border: 4px solid #ffe27a; border-radius: 8px; animation: turn 2.4s ease-in-out infinite; }
      #rotate button {
        padding: 6px 18px; border: 3px solid #1d1322; outline: 2px solid #ffe27a; background: #4a8f3c; color: #f6efd8;
        font: inherit; font-size: 24px;
      }
      #rotate button[hidden] { display: none; }
      @keyframes turn { 0%, 25% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="rotate" role="alert">
      <div class="phone"></div>
      <p>Xoay ngang điện thoại để chơi</p>
      <button type="button" id="rotate-full">Xoay giúp tôi</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
